specVersion: 1.0.0
indexerHints:
  prune: auto
schema:
  file: ./schema.graphql
dataSources:
  - kind: ethereum
    name: FeeAccount
    network: sepolia
    source:
      address: "0x4cb6F8d17a980Da9891C377c437749B1AAC7862F"
      abi: FeeAccount
      startBlock: 9018158
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.7
      language: wasm/assemblyscript
      entities:
        - Pool
        - LatestReward
        - Reward
      abis:
        - name: FeeAccount
          file: ./abis/FeeAccount.json
      eventHandlers:
        - event: Rewarded(indexed address,indexed address,uint256,uint256)
          handler: handleRewarded
        - event: MigratorUpdated(indexed address)
          handler: handleMigratorUpdated
      file: ./src/fee-account.ts
templates:
- kind: ethereum
  name: UniswapV3Migrator
  network: sepolia
  source:
    abi: UniswapV3Migrator
  mapping:
    kind: ethereum/events
    apiVersion: 0.0.7
    language: wasm/assemblyscript
    entities:
      - Pool
      - MigratorCreatedPool
      - LiquidityLock
      - MigratedPool
    abis:
      - name: UniswapV3Migrator
        file: ./abis/UniswapV3Migrator.json
    eventHandlers:
      - event: PoolCreated(indexed address,indexed address,indexed address,int24,uint256,uint160)
        handler: handlePoolCreated
      - event: LiquidityLocked(indexed uint256,uint256,uint256)
        handler: handleLiquidityLocked
      - event: PoolMigrated(indexed address,indexed address,uint256,uint256,uint256,uint256,uint256,uint256)
        handler: handlePoolMigrated
    file: ./src/uniswap-v-3-migrator.ts
- kind: ethereum
  name: UniswapV3Pool
  network: sepolia
  source:
    abi: UniswapV3Pool
  mapping:
    kind: ethereum/events
    apiVersion: 0.0.7
    language: wasm/assemblyscript
    entities:
      - Pool
      - HistoricPool
      - Counter
      - LatestReward
    abis:
      - name: UniswapV3Pool
        file: ./abis/UniswapV3Pool.json
    eventHandlers:
      - event: Burn(indexed address,indexed int24,indexed int24,uint128,uint256,uint256)
        handler: handleBurn
      - event: Mint(address,indexed address,indexed int24,indexed int24,uint128,uint256,uint256)
        handler: handleMint
      - event: Swap(indexed address,indexed address,int256,int256,uint160,uint128,int24)
        handler: handleSwap
    file: ./src/uniswap-v-3-pool.ts
