specVersion: 1.0.0
indexerHints:
  prune: auto
schema:
  file: ./schema.graphql
dataSources:
  - kind: ethereum
    name: FeeAccount
    network: robinhood-testnet
    source:
      address: "0x962BAE7Df508C4e7f4532B658c22a099B8782439" #TODO: update when launching
      abi: FeeAccount
      startBlock: 123811842 #TODO: update when launching
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.7
      language: wasm/assemblyscript
      entities:
        - Pool
        - LatestReward
        - Reward
      abis:
        - name: FeeAccount
          file: ./abis/FeeAccount.json
      eventHandlers:
        - event: Rewarded(indexed address,indexed address,uint256,uint256)
          handler: handleRewarded
        - event: MigratorUpdated(indexed address)
          handler: handleMigratorUpdated
      file: ./src/fee-account.ts
templates:
- kind: ethereum
  name: LiquidityMigrator
  network: robinhood-testnet
  source:
    abi: ILiquidityMigrator
  mapping:
    kind: ethereum/events
    apiVersion: 0.0.7
    language: wasm/assemblyscript
    entities:
      - Pool
    abis:
      - name: ILiquidityMigrator
        file: ./abis/ILiquidityMigrator.json
    eventHandlers:
      - event: PoolCreated(indexed address,indexed address,indexed address,int24,uint256,uint160)
        handler: handlePoolCreated
    file: ./src/liquidity-migrator.ts
- kind: ethereum
  name: UniswapV3Pool
  network: robinhood-testnet
  source:
    abi: IUniswapV3Pool
  mapping:
    kind: ethereum/events
    apiVersion: 0.0.7
    language: wasm/assemblyscript
    entities:
      - Pool
      - Counter
      - LatestReward
    abis:
      - name: IUniswapV3Pool
        file: ./abis/IUniswapV3Pool.json
    eventHandlers:
      - event: Burn(indexed address,indexed int24,indexed int24,uint128,uint256,uint256)
        handler: handleBurn
      - event: Mint(address,indexed address,indexed int24,indexed int24,uint128,uint256,uint256)
        handler: handleMint
      - event: Swap(indexed address,indexed address,int256,int256,uint160,uint128,int24)
        handler: handleSwap
    file: ./src/uniswap-v3-pool.ts
