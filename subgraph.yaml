specVersion: 1.0.0
indexerHints:
  prune: auto
schema:
  file: ./schema.graphql
dataSources:
  - kind: ethereum
    name: FeeAccount
    network: sepolia
    source:
      address: "0x4cb6F8d17a980Da9891C377c437749B1AAC7862F" #TODO: update when launching
      abi: FeeAccount
      startBlock: 9018158 #TODO: update when launching
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.7
      language: wasm/assemblyscript
      entities:
        - Pool
        - LatestReward
        - Reward
      abis:
        - name: FeeAccount
          file: ./abis/FeeAccount.json
      eventHandlers:
        - event: Rewarded(indexed address,indexed address,uint256,uint256)
          handler: handleRewarded
        - event: MigratorUpdated(indexed address)
          handler: handleMigratorUpdated
      file: ./src/fee-account.ts
  - kind: ethereum
    name: LiquidityLocker
    network: sepolia
    source:
      address: "0x4cb6F8d17a980Da9891C377c437749B1AAC7862F" #TODO: update when launching
      abi: ILiquidityLocker
      startBlock: 9018158 #TODO: update when launching
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.7
      language: wasm/assemblyscript
      entities:
        - LiquidityLock
        - MigratedPool
      abis:
        - name: ILiquidityLocker
          file: ./abis/ILiquidityLocker.json
      eventHandlers:
        - event: LiquidityMigrated(indexed uint256,indexed address,indexed address)
          handler: handleLiquidityMigrated
      file: ./src/liquidity-locker.ts
templates:
- kind: ethereum
  name: LiquidityMigrator
  network: sepolia
  source:
    abi: ILiquidityMigrator
  mapping:
    kind: ethereum/events
    apiVersion: 0.0.7
    language: wasm/assemblyscript
    entities:
      - Pool
      - MigratorCreatedPool
      - LiquidityLock
      - MigratedPool
    abis:
      - name: ILiquidityMigrator
        file: ./abis/ILiquidityMigrator.json
    eventHandlers:
      - event: PoolCreated(indexed address,indexed address,indexed address,int24,uint256,uint160)
        handler: handlePoolCreated
      - event: LiquidityLocked(indexed address,uint256,uint256)
        handler: handleLiquidityLocked
      - event: PoolMigrated(indexed address,indexed address,uint256,address,uint256,uint256,uint256,uint256)
        handler: handlePoolMigrated
    file: ./src/liquidity-migrator.ts
- kind: ethereum
  name: CLPool
  network: sepolia
  source:
    abi: ICLPool
  mapping:
    kind: ethereum/events
    apiVersion: 0.0.7
    language: wasm/assemblyscript
    entities:
      - Pool
      - HistoricPool
      - Counter
      - LatestReward
    abis:
      - name: ICLPool
        file: ./abis/ICLPool.json
    eventHandlers:
      - event: Burn(indexed address,indexed int24,indexed int24,uint128,uint256,uint256)
        handler: handleBurn
      - event: Mint(address,indexed address,indexed int24,indexed int24,uint128,uint256,uint256)
        handler: handleMint
      - event: Swap(indexed address,indexed address,int256,int256,uint160,uint128,int24)
        handler: handleSwap
    file: ./src/aerodrome-cl-pool.ts
